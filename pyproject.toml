[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yara-threat-defense-engine"
version = "1.0.0"
description = "Project exploring malware scanning with YARA and ClamAV."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ethan REDACTED", email = "ethan@REDACTED" }
]
keywords = [
    "security",
    "yara",
    "clamav",
    "threat-defense",
    "malware-detection",
    "ast-validation",
    "incident-response",
    "forensics",
    "quarantine",
    "offline-security",
    "devsecops",
]
classifiers = [
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Ethan-da-Tech-Wizard/yara-threat-defense-engine"
Repository = "https://github.com/Ethan-da-Tech-Wizard/yara-threat-defense-engine"
Issues = "https://github.com/Ethan-da-Tech-Wizard/yara-threat-defense-engine/issues"
